<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SBP Team Directory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Ccircle cx='15' cy='15' r='6' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M20 20l6 6' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#0b0b0c; --soft:#4a4a4f; --mute:#9a9aa0; --faint:#c9c9ce; --line:#efeff1;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:#fff;color:var(--ink);
  font-family:"Inter","SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-feature-settings:"ss01","cv11","tnum";
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  padding:0 clamp(20px,5vw,48px) calc(80px + env(safe-area-inset-bottom));
}
.wrap{max-width:900px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;touch-action:manipulation}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:center;padding:calc(22px + env(safe-area-inset-top)) 0 0;
  font-size:.8rem;letter-spacing:.02em;color:var(--mute)}
.mark{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600;letter-spacing:-.01em}
.mark i{width:8px;height:8px;border-radius:50%;background:var(--ink);display:block}

/* hero (collapses once you type) */
.hero{display:grid;grid-template-rows:1fr;margin-top:22px;opacity:1;
  transition:grid-template-rows .6s var(--ease),opacity .4s ease}
.hero-clip{overflow:hidden;min-height:0}
.hero-in{padding:calc(clamp(40px,12vh,110px) - 22px) 0 clamp(20px,4vh,40px)}
.hero h1{margin:0;font-size:clamp(2.6rem,9.5vw,5.2rem);line-height:1;font-weight:650;letter-spacing:-.055em}
.hero h1 span{color:var(--faint)}
body.q .hero{grid-template-rows:0fr;opacity:0}

/* search */
.search{position:sticky;top:0;z-index:10;padding:10px 0 0;
  background:rgba(255,255,255,.96);will-change:transform}
.field{position:relative}
/* what you type is drawn here, letter by letter; the real <input> underneath keeps caret, selection and paste */
.type{position:absolute;left:0;right:44px;top:0;bottom:0;overflow:hidden;pointer-events:none}
.type-in{white-space:pre;padding:14px 0 16px;color:var(--ink);will-change:transform;
  font:inherit;font-weight:500;font-size:clamp(1.55rem,5.4vw,2.6rem);letter-spacing:-.04em;font-kerning:none}
.ch{display:inline-block;white-space:pre}
.ch.in{animation:glyph .5s var(--ease) calc(var(--i,0) * 18ms) backwards}
input::selection{background:#ececef}
input{
  width:100%;border:0;outline:0;background:transparent;border-radius:0;color:transparent;caret-color:var(--ink);
  font:inherit;font-weight:500;font-size:clamp(1.55rem,5.4vw,2.6rem);letter-spacing:-.04em;font-kerning:none;
  padding:14px 44px 16px 0;-webkit-appearance:none;appearance:none;
}
input::placeholder{color:var(--faint);transition:color .3s}
input.flying + .type{visibility:hidden}
input::-webkit-search-cancel-button{display:none}
.rule{height:2px;background:var(--line);position:relative}
.rule::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;
  transition:transform .6s var(--ease)}
.field:focus-within + .rule::after,body.q .rule::after{transform:scaleX(1)}
.clear{position:absolute;right:0;top:calc(50% - 2px);transform:translateY(-50%) scale(.8);width:34px;height:34px;border-radius:50%;
  background:var(--line);color:var(--soft);font-size:18px;line-height:34px;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease),background .2s}
.clear.show{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
.clear:hover{background:#e4e4e8}

/* a tapped name travels up into the search box */
.flyer{position:fixed;left:0;top:0;z-index:50;margin:0;pointer-events:none;white-space:nowrap;
  transform-origin:0 0;will-change:transform;font-weight:500;letter-spacing:-.04em;font-kerning:none}

/* helper line */
.meta{display:flex;justify-content:space-between;align-items:center;min-height:28px;margin-top:14px;font-size:.8rem;color:var(--mute)}
.meta b{font-weight:500;color:var(--soft)}
.link{color:var(--mute);transition:color .2s;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.link:hover{color:var(--ink);text-decoration-color:var(--ink)}

/* suggestions */
.try-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .5s var(--ease),opacity .35s ease}
.try-clip{overflow:hidden;min-height:0}
.try{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding-top:10px;font-size:1rem;color:var(--mute)}
body.q .try-wrap,body.browse .try-wrap{grid-template-rows:0fr;opacity:0}
.try button{color:var(--ink);font-weight:500;letter-spacing:-.02em;transition:opacity .2s}
.try button:hover{opacity:.45}

/* results */
.list{margin-top:6px}
.res{padding:clamp(26px,4.5vw,44px) 0;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.name{margin:0;font-weight:620;letter-spacing:-.045em;line-height:1.04;font-size:clamp(1.7rem,6vw,3rem)}
.res.top .name{font-size:clamp(2.2rem,8.4vw,4.6rem);letter-spacing:-.055em}
.name .code{color:var(--faint);font-weight:500}
.teams{display:flex;flex-wrap:wrap;gap:4px 0;margin:clamp(12px,2vw,20px) 0 0;
  font-size:clamp(1.1rem,3.4vw,1.6rem);font-weight:500;letter-spacing:-.03em;line-height:1.25}
.res.top .teams{font-size:clamp(1.3rem,4.2vw,2rem)}
.teams button{color:var(--soft);transition:color .2s}
.teams button:not(:last-child)::after{content:"/";color:var(--faint);margin:0 .5em;font-weight:400}
.teams button:hover{color:var(--ink)}
.teams .none{color:var(--faint);font-size:.9em;font-weight:400}
.alumni{margin-top:clamp(12px,2vw,18px);display:flex;flex-direction:column;gap:2px}
.alumni small{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.alumni button{font-size:.92rem;color:var(--mute);line-height:1.45;transition:color .2s;max-width:640px}
.alumni button:hover{color:var(--ink)}
.kicker{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.note{margin-top:12px;color:var(--mute);font-size:.9rem}

/* compact list (browse all) */
.compact .res{padding:14px 0;content-visibility:auto;contain-intrinsic-size:auto 64px}
.compact .name{font-size:clamp(1.15rem,3.6vw,1.5rem);letter-spacing:-.035em}
.compact .teams{margin-top:4px;font-size:.95rem;color:var(--mute)}
.compact .alumni{display:none}

/* highlight */
mark{background:linear-gradient(transparent 58%,#ffe46b 58%) no-repeat 0 0/100% 100%;color:inherit;padding:0}
/* the highlight wipes in left to right, only on cards that are fading in */
.enter mark{animation:sweep .6s var(--ease) calc(var(--d,0ms) + 420ms) backwards}
@keyframes sweep{from{background-size:0% 100%}}

/* empty */
.empty{padding:clamp(40px,10vh,90px) 0}
.empty h2{margin:0;font-weight:620;letter-spacing:-.05em;font-size:clamp(1.8rem,6.5vw,3.2rem);line-height:1.05}
.empty h2 span{color:var(--faint)}
.empty p{margin:14px 0 0;color:var(--mute)}

footer{margin-top:56px;color:var(--faint);font-size:.75rem;letter-spacing:.02em}
kbd{font:inherit;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--mute)}

/* motion */
/* Every keyframe only defines `from`, so with reduced motion (animations off) everything simply shows. */
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translate3d(0,10px,0)}}
@keyframes glyph{from{opacity:0;transform:translate3d(0,.45em,0)}}
@keyframes wordUp{from{transform:translate3d(0,135%,0)}}
.enter{animation:fade .5s ease var(--d,0ms) backwards}
.enter .alumni,.enter .note,.enter .kicker,.empty.enter h2,.empty.enter p{animation:rise .7s var(--ease) calc(var(--d,0ms) + 320ms) backwards}
/* school names: each word slides up out of a clipped line */
.w{display:inline-block;clip-path:inset(-.2em -.3em -.18em -.3em)}
.wi{display:inline-block;animation:wordUp .75s var(--ease) calc(var(--d,0ms) + var(--i,0) * 45ms) backwards}
/* team names: letters rise one after another */
.g{display:inline-block;animation:glyph .55s var(--ease) calc(var(--d,0ms) + 140ms + var(--i,0) * 14ms) backwards}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
@media (max-width:520px){ .bar .count{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="mark"><i></i>SBP Teams</div>
    <div class="count" id="counts"></div>
  </div>

  <section class="hero" aria-hidden="false"><div class="hero-clip"><div class="hero-in">
    <h1>Find any team,<br><span>school or alumni.</span></h1>
  </div></div></section>

  <div class="search">
    <div class="field">
      <input id="q" type="search" placeholder="Start typing…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search teams, schools or alumni" autofocus>
      <div class="type" aria-hidden="true"><div class="type-in" id="typeIn"></div></div>
      <button class="clear" id="clear" aria-label="Clear search">&times;</button>
    </div>
    <div class="rule"></div>
  </div>

  <div class="meta"><span id="status"></span><button class="link" id="browse">Browse all</button></div>
  <div class="try-wrap"><div class="try-clip"><div class="try" id="try"></div></div></div>

  <main class="list" id="list"></main>
  <footer>Tap any name to search it &nbsp;·&nbsp; <kbd>/</kbd> to search &nbsp;·&nbsp; <kbd>esc</kbd> to clear</footer>
</div>

<script>
const DATA = /*__DATA__*/;

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold = s => s.normalize('NFKD').toLowerCase();
const norm = s => fold(s).replace(/[^a-z0-9]/g,'');
const words = s => fold(s).split(/[^a-z0-9]+/).filter(Boolean);
const reEsc = c => c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

// One record per school, plus one per alumni group that isn't linked to a school.
const records = [
  ...DATA.schools.map(s => ({kind:'school', title:s.school, code:s.code, teams:s.teams, alumni:s.alumni})),
  ...DATA.alumniOnly.map(a => ({kind:'alumni', title:a.alumni, code:a.short, teams:[], alumni:[]}))
];
records.forEach((r,i) => {
  r.id = i;
  r.entries = [
    {t:'school', text:r.title, w:r.kind==='school'?88:96},
    ...(r.code ? [{t:'code', text:r.code, w:100}] : []),
    ...r.teams.map(x => ({t:'team', text:x, w:100})),
    ...r.alumni.map(x => ({t:'alumni', text:x, w:94}))
  ];
  r.hay = norm(r.entries.map(e => e.text).join(' '));
  r.entries.forEach(e => { e.n = norm(e.text); e.words = words(e.text); });
});

const totalTeams = DATA.schools.reduce((n,s)=>n+s.teams.length,0);
const totalAlumni = DATA.schools.reduce((n,s)=>n+s.alumni.length,0) + DATA.alumniOnly.length;
document.getElementById('counts').textContent =
  `${DATA.schools.length} schools · ${totalTeams} team names · ${totalAlumni} alumni groups`;

function score(r, qc, qw){
  let best = 0;
  for(const e of r.entries){
    let s = 0;
    if(e.n === qc) s = 100;
    else if(e.words.some(w => w.startsWith(qc)) || e.n.startsWith(qc)) s = 75;
    else if(e.n.includes(qc)) s = 55;
    else if(qw.length > 1 && qw.every(w => e.n.includes(w))) s = 45;
    if(s) best = Math.max(best, s * e.w / 100);
  }
  if(!best && qw.length > 1 && qw.every(w => r.hay.includes(w))) best = 25;
  return best;
}

function highlighter(q){
  const qc = norm(q), qw = words(q);
  if(!qc) return t => esc(t);
  const pat = s => [...s].map(reEsc).join('[^a-z0-9]*');
  const re = new RegExp([pat(qc), ...qw.map(pat)].join('|'), 'gi');
  return t => {
    let out = '', last = 0, m;
    re.lastIndex = 0;
    while((m = re.exec(t)) && m[0]){
      out += esc(t.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
      last = m.index + m[0].length;
    }
    return out + esc(t.slice(last));
  };
}

// "SM Sains Hulu Selangor (SEMASHUR)" -> name + faded code
function titleHTML(t, hl, anim){
  const ctr = {i:0};   // one running word index, so the stagger continues into the faded code
  const w = h => anim ? splitWords(h, ctr) : h;
  const m = t.match(/^(.*?)\s*(\([^()]*\))\s*$/);
  if(!m) return w(hl(t));
  return w(hl(m[1])) + ' <span class="code">' + w(hl(m[2])) + '</span>';
}

// Wrap each word of already-highlighted HTML so it can slide up out of a clipped line.
// A <mark> that spans several words is closed and re-opened around each one.
function splitWords(html, ctr){
  let out = '', buf = '', inMark = false;
  const flush = () => {
    if(buf.replace(/<\/?mark>/g, '')) out += `<span class="w"><span class="wi" style="--i:${ctr.i++}">${buf}</span></span>`;
    buf = '';
  };
  for(const t of html.match(/<\/?mark>|\s+|[^<\s]+/g) || []){
    if(t === '<mark>'){ inMark = true; buf += t; }
    else if(t === '</mark>'){ inMark = false; buf += t; }
    else if(/^\s+$/.test(t)){ if(inMark) buf += '</mark>'; flush(); out += ' '; if(inMark) buf = '<mark>'; }
    else buf += t;
  }
  flush();
  return out;
}

// Same idea per letter, for team names (stagger is capped so long names stay quick).
function splitLetters(html){
  let out = '', i = 0;
  for(const t of html.match(/<\/?mark>|&[a-z#0-9]+;|[\s\S]/g) || []){
    if(t[0] === '<' || t === ' ') out += t;
    else out += `<span class="g" style="--i:${Math.min(i++, 18)}">${t}</span>`;
  }
  return out;
}

function card(r, hl, isTop, enter, delay){
  const cls = 'res' + (isTop ? ' top' : '') + (enter ? ' enter' : '');
  const st = enter ? ` style="--d:${delay}ms"` : '';
  let h = `<article class="${cls}"${st}>`;
  if(r.kind === 'alumni'){
    h += `<span class="kicker">Alumni group</span><h2 class="name">${titleHTML(r.title, hl, enter)}</h2>`;
    h += `<div class="note">Not linked to a school in the sheet yet.</div>`;
  } else {
    h += `<h2 class="name">${titleHTML(r.title, hl, enter)}</h2>`;
    h += `<div class="teams">` + (r.teams.length
      ? r.teams.map(t => `<button data-q="${esc(t)}">${enter ? splitLetters(hl(t)) : hl(t)}</button>`).join('')
      : `<span class="none">No team names yet</span>`) + `</div>`;
    if(r.alumni.length){
      h += `<div class="alumni"><small>Alumni</small>` +
        r.alumni.map(a => `<button data-q="${esc(a)}">${hl(a)}</button>`).join('') + `</div>`;
    }
  }
  return h + `</article>`;
}

const $q = document.getElementById('q'), $list = document.getElementById('list'),
      $status = document.getElementById('status'), $clear = document.getElementById('clear'),
      $browse = document.getElementById('browse'), $try = document.getElementById('try');

let browsing = false;
let shown = new Set();   // record ids currently on screen, so only NEW results fade in

// a few random single-word team names as starting points
(function(){
  const pool = DATA.schools.flatMap(s => s.teams).filter(t => /^[A-Za-z0-9]{4,10}$/.test(t));
  const pick = [...new Set(pool)].sort(() => Math.random() - .5).slice(0, 5);
  $try.innerHTML = '<span>Try</span>' + pick.map(t => `<button data-q="${esc(t)}">${esc(t)}</button>`).join('');
})();

const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- typewriter placeholder: slowly types real team names while the box is empty ----
let kickTypewriter = () => {};
(function(){
  if(calm) return;
  const words = [...new Set(DATA.schools.flatMap(s => s.teams).filter(t => /^[A-Za-z0-9 ]{4,14}$/.test(t)))]
    .sort(() => Math.random() - .5).slice(0, 8);
  if(!words.length) return;
  let w = 0, n = 0, phase = 'type', running = false, timer = 0;
  const put = () => { $q.placeholder = 'Try ' + words[w].slice(0, n); };
  function tick(){
    if($q.value){ running = false; $q.placeholder = 'Start typing…'; return; }
    if(document.hidden){ timer = setTimeout(tick, 500); return; }
    let wait;
    if(phase === 'type'){
      n++; put();
      if(n >= words[w].length){ phase = 'erase'; wait = 1800; } else wait = 70 + Math.random() * 60;
    } else {
      n--; put();
      if(n <= 0){ phase = 'type'; w = (w + 1) % words.length; wait = 500; } else wait = 32;
    }
    timer = setTimeout(tick, wait);
  }
  kickTypewriter = () => {
    if(running || $q.value) return;
    running = true; clearTimeout(timer); phase = 'type'; n = 0;
    timer = setTimeout(tick, 300);
  };
  kickTypewriter();
})();

// ---- tapped name flies into the search box (transform only, so it stays on the GPU) ----
let flyer = null;
function landFlyer(){
  if(flyer){ flyer.remove(); flyer = null; }
  $q.classList.remove('flying');
}
function flyToSearch(btn, value){
  landFlyer();
  const r = btn.getBoundingClientRect();
  const heroH = document.body.classList.contains('q') ? 0 : document.querySelector('.hero').getBoundingClientRect().height;
  const bs = getComputedStyle(btn), fb = parseFloat(bs.fontSize), c0 = bs.color;

  setQuery(value, false);
  try{ window.scrollTo({top:0, behavior:'instant'}); }catch(e){ window.scrollTo(0,0); }

  const to = $q.getBoundingClientRect();           // hero is still full height here, so subtract it
  const fi = parseFloat(getComputedStyle($q).fontSize), lh = r.height / fb;
  const el = document.createElement('div');
  el.className = 'flyer'; el.textContent = value;
  el.style.cssText = `font-size:${fi}px;line-height:${lh}`;
  document.body.appendChild(el);
  $q.classList.add('flying');
  flyer = el;

  const ty = to.top - heroH + (to.height - 2) / 2 - fi * lh / 2 + 1;   // +1: matches the input's baseline
  const a = el.animate([
    {transform:`translate(${r.left}px,${r.top}px) scale(${fb / fi})`, color:c0},
    {transform:`translate(${to.left}px,${ty}px) scale(1)`, color:'#0b0b0c'}
  ], {duration:560, easing:'cubic-bezier(.2,.7,.2,1)', fill:'both'});
  a.onfinish = a.oncancel = () => { if(flyer === el) landFlyer(); };
}

// ---- the search box types letter by letter ----
const $type = document.getElementById('typeIn');
let typed = [];
function syncTypeScroll(){ $type.style.transform = `translate3d(${-$q.scrollLeft}px,0,0)`; }
function paintType(animate){
  const next = Array.from($q.value);
  let k = 0;
  while(k < next.length && k < typed.length && next[k] === typed[k]) k++;      // keep letters that didn't change
  while($type.childNodes.length > k) $type.lastChild.remove();
  const anim = animate && !calm;
  for(let i = k; i < next.length; i++){
    const s = document.createElement('span');
    s.className = anim ? 'ch in' : 'ch';
    s.textContent = next[i];
    if(anim) s.style.setProperty('--i', Math.min(i - k, 10));   // a paste ripples in
    $type.appendChild(s);
  }
  typed = next;
  syncTypeScroll();
}
const followCaret = () => requestAnimationFrame(syncTypeScroll);
['keyup','click','select','focus','mouseup','touchend'].forEach(ev => $q.addEventListener(ev, followCaret));
addEventListener('resize', followCaret);

function render(){
  const q = $q.value.trim();
  const qc = norm(q), qw = words(q);
  const hasQ = !!qc;
  document.body.classList.toggle('q', hasQ);
  document.body.classList.toggle('browse', !hasQ && browsing);
  $clear.classList.toggle('show', !!$q.value);
  $list.classList.toggle('compact', !hasQ && browsing);
  $browse.textContent = browsing && !hasQ ? 'Hide list' : 'Browse all';
  $browse.style.display = hasQ ? 'none' : '';

  let rows = [];
  if(hasQ){
    rows = records.map(r => ({r, s:score(r, qc, qw)})).filter(x => x.s > 0)
      .sort((a,b) => b.s - a.s || a.r.title.localeCompare(b.r.title)).map(x => x.r);
    $status.innerHTML = rows.length ? `<b>${rows.length}</b> result${rows.length>1?'s':''}` : '';
  } else if(browsing){
    rows = [...records].sort((a,b) => (a.kind===b.kind ? 0 : a.kind==='school' ? -1 : 1) || a.title.localeCompare(b.title));
    $status.innerHTML = `<b>${rows.length}</b> in total, A–Z`;
  } else {
    $status.textContent = '';
  }

  if(hasQ && !rows.length){
    $list.innerHTML = `<div class="empty enter"><h2>No match for<br><span>“${esc(q)}”</span></h2><p>Try a shorter part of the name, or the school code.</p></div>`;
    shown = new Set();
  } else {
    const hl = highlighter(q);
    let n = 0;   // only the first 12 new cards animate; the rest are off-screen anyway
    $list.innerHTML = rows.map((r,i) => {
      const fresh = !shown.has(r.id);
      const animate = fresh && n < 12;
      const delay = animate ? Math.min(n, 7) * 70 : 0;
      if(fresh) n++;
      return card(r, hl, hasQ && i === 0, animate, delay);
    }).join('');
    shown = new Set(rows.map(r => r.id));
  }
  if(!$q.value) kickTypewriter();
  syncHash();
}

// URL hash updates are debounced so typing never waits on history.replaceState
let hashTimer = 0;
function syncHash(){
  clearTimeout(hashTimer);
  hashTimer = setTimeout(() => {
    const q = $q.value.trim();
    try{ history.replaceState(null,'', q ? '#q='+encodeURIComponent(q) : location.pathname + location.search); }catch(e){}
  }, 250);
}

// at most one render per frame, however fast the keys come in
let frame = 0;
function schedule(){
  if(frame) return;
  frame = requestAnimationFrame(() => { frame = 0; render(); });
}

function setQuery(v, jump){
  $q.value = v; paintType(false); render();
  if(jump) window.scrollTo({top:0, behavior:'smooth'});
}

$q.addEventListener('input', () => { paintType(true); followCaret(); schedule(); });
$clear.addEventListener('click', () => { setQuery(''); $q.focus(); });
$browse.addEventListener('click', () => { browsing = !browsing; shown = new Set(); render(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-q]');
  if(!b) return;
  const v = b.dataset.q;
  if(!calm && v.length <= 16 && b.animate) flyToSearch(b, v);   // long alumni names just jump
  else setQuery(v, true);
});
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== $q){ e.preventDefault(); $q.focus(); $q.select(); }
  else if(e.key === 'Escape' && $q.value){ setQuery(''); }
});

const m = location.hash.match(/^#q=(.*)$/);
if(m){ try{ $q.value = decodeURIComponent(m[1]); }catch(e){} }
paintType(false);
render();
</script>
</body>
</html>
